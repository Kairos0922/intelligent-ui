name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run audit:content
      - run: npm run build
      - run: npm run typecheck
      - run: node --test tests/*.test.mjs
      - run: npm run bench:selfcheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run pack:all
      - run: npm run audit:pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist-pkg/*.tgz
          --title "Intelligent UI $GITHUB_REF_NAME"
          --generate-notes
